[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tradedoccheck"
version = "0.1.0"
description = "Simple shipment-document data checks for Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Open-source contributors"}]

[project.scripts]
tradedoccheck = "tradedoccheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
